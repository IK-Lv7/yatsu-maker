name: Generate Daily Predictions

# CPU推論のため数十分かかる想定(パブリックリポジトリはActions時間無制限なので許容)
on:
  schedule:
    # 毎日 05:00 JST (UTC 前日20:00)。動画投稿より前に予想を公開する想定
    - cron: "0 20 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers peft accelerate PyYAML requests

      - name: Generate predictions and publish to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TITLE_NOISE_STRINGS: ${{ secrets.TITLE_NOISE_STRINGS }}
        run: |
          python3 -m ml.generate.generate \
            --config ml/configs/generate_default.yaml \
            --publish-to-supabase
